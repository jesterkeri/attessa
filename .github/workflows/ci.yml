# Project CI per PIPELINE.md "Stages" (PR rows). The harness workflow stays as installed.
# Every job here is meant to be a required status check on main and staging.
name: ci

on:
  pull_request:
  push:
    branches: [main, staging, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The core adversary tests call Foundry's cast, so the ts job needs the same pinned Foundry.
      - id: foundry
        run: |
          v=$(tr -d '[:space:]' < contracts/FOUNDRY_VERSION)
          [[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "contracts/FOUNDRY_VERSION is not vX.Y.Z: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ steps.foundry.outputs.version }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # core's package types point at dist, so dependents typecheck against a built core.
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - id: foundry
        # A missing or malformed pin must fail here: an empty version makes foundry-toolchain install stable.
        run: |
          v=$(tr -d '[:space:]' < contracts/FOUNDRY_VERSION)
          [[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "contracts/FOUNDRY_VERSION is not vX.Y.Z: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ steps.foundry.outputs.version }}
      - run: forge --version
      - working-directory: contracts
        run: forge fmt --check
      - working-directory: contracts
        run: forge build
      # Unit + invariant at 64 runs (PIPELINE); 256 runs / depth 50 is nightly.
      - working-directory: contracts
        env:
          FOUNDRY_INVARIANT_RUNS: '64'
          FOUNDRY_INVARIANT_DEPTH: '50'
        run: forge test
      # INV-18: every vector value recomputed with cast, independent of core and viem.
      # vectors/ and the oracle land together (T03); once vectors/ exists a missing oracle fails.
      - run: |
          if [ ! -d vectors ]; then echo "no vectors/ yet"; exit 0; fi
          python3 -I scripts/check-vectors-oracle.py

  slither:
    name: slither
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - id: foundry
        # A missing or malformed pin must fail here: an empty version makes foundry-toolchain install stable.
        run: |
          v=$(tr -d '[:space:]' < contracts/FOUNDRY_VERSION)
          [[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "contracts/FOUNDRY_VERSION is not vX.Y.Z: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ steps.foundry.outputs.version }}
      - run: pipx install slither-analyzer==0.11.6
      # Slither resolves symlinks before matching include_paths, so a symlinked file could escape it.
      # find, after the recursive checkout, also sees symlinks inside submodules (git ls-files does not).
      # Slither honours inline slither-disable comments in any file a result touches, lib/ included,
      # so triage goes only by id through contracts/slither.db.json (docs/SLITHER_TRIAGE.md).
      # Slither drops lib/nitro-validator/ only because it is pinned at 0ea0d12 (adr/001): the pin
      # check fails a moved gitlink, another .gitmodules url, or a checkout that differs from the pin.
      # Slither analyses what forge builds, so forge's effective configuration and remappings are pinned
      # by hash too (a .env under contracts/ or a FOUNDRY_* variable fails): changing the build means
      # changing these two hashes (scripts/check-slither-build.sh --print).
      - run: |
          bash scripts/check-nitro-pin.sh
          bash scripts/check-slither-build.sh c786f19f6b3447b730790ca955f962fecac6c43cbbbc77a309bcdf7f9d597cbd 13f8341e22c75c4486aaa3d448461acd3be099f47849fd3ed4d689e057fe0ddf
          links=$(find contracts -type l)
          if [ -n "$links" ]; then echo "symlinks under contracts/ are not allowed:"; echo "$links"; exit 1; fi
          rc=0; grep -rn slither-disable contracts || rc=$?
          if [ $rc -ne 1 ]; then echo "slither-disable comments under contracts/ are not allowed (grep rc=$rc): triage by id in contracts/slither.db.json"; exit 1; fi
      # Nothing to analyse before the first contract lands; once one exists the config must too.
      # Slither also hides any result marked reviewed in export.sarif + export.sarif.sarifexplorer in
      # its working directory. Both are pointed at paths that cannot exist (/dev/null is not a folder),
      # on the command line, which slither.config.json cannot override, so slither.db.json stays the
      # only triage source.
      - working-directory: contracts
        run: |
          if [ -z "$(find src -name '*.sol' -print -quit 2>/dev/null)" ]; then echo "no contracts in contracts/src yet"; exit 0; fi
          test -f slither.config.json || { echo "contracts/slither.config.json is missing"; exit 1; }
          # The config can switch detectors or Highs off, so it is pinned by hash: changing it means changing this line too.
          echo "286a5db0516ed27fe867c3f4f0502e5062eff84701a3d4c842fab4ece9c998ca  slither.config.json" | sha256sum -c - || { echo "contracts/slither.config.json differs from the pinned config"; exit 1; }
          slither . --config-file slither.config.json --fail-high --sarif-input /dev/null/no-sarif-input --sarif-triage /dev/null/no-sarif-triage

  enclave:
    name: enclave
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml (exact version, rustfmt, clippy).
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check --manifest-path enclave/Cargo.toml
      - run: cargo clippy --locked --manifest-path enclave/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path enclave/Cargo.toml
